<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Socket.IO chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Welcome screen -->
  <div id="welcome">
    <div class="bubbles">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <form id="joinForm" class="welcome-card" autocomplete="off">
      <div id="avatarPreview" class="avatar big"></div>
      <h1>Welcome to Chat</h1>
      <p>Pick a name and a color to get started</p>

      <input id="nameInput" type="text" maxlength="20" placeholder="Your name" />

      <div class="colors" id="colors">
        <button type="button" class="color-option selected" data-color="#00a884" style="background:#00a884" title="Green"></button>
        <button type="button" class="color-option" data-color="#0b7cff" style="background:#0b7cff" title="Blue"></button>
        <button type="button" class="color-option" data-color="#e91e63" style="background:#e91e63" title="Pink"></button>
        <button type="button" class="color-option" data-color="#ff9800" style="background:#ff9800" title="Orange"></button>
        <button type="button" class="color-option" data-color="#9c27b0" style="background:#9c27b0" title="Purple"></button>
        <button type="button" class="color-option" data-color="#f44336" style="background:#f44336" title="Red"></button>
      </div>

      <button type="submit" id="joinBtn">Join chat ➤</button>
    </form>
  </div>

  <!-- Top bar -->
  <div id="topbar">
    <div id="userAvatar" class="avatar">?</div>
    <div class="topbar-text">
      <strong id="userName">Guest</strong>
      <small>Online</small>
    </div>
    <button type="button" id="leaveBtn">Leave</button>
  </div>

  <!-- Chat messages appear here -->
  <ul id="messages"></ul>

  <!-- Emoji picker -->
  <emoji-picker id="emojiPanel"></emoji-picker>

  <!-- Camera screen -->
  <div id="cameraModal">
    <video id="video" autoplay playsinline muted></video>
    <img id="preview" alt="preview" hidden />
    <div id="cameraControls">
      <button type="button" id="camClose">✕ Close</button>
      <button type="button" id="shutter" title="Take photo"></button>
      <button type="button" id="camSwitch">🔄 Flip</button>
      <button type="button" id="camRetake" hidden>↩ Retake</button>
      <button type="button" id="camSend" class="primary" hidden>Send ➤</button>
    </div>
  </div>

  <!-- Message bar -->
  <form id="form" action="">
    <button type="button" id="emojiBtn" class="icon-btn" title="Emoji">
      <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
    </button>

    <button type="button" id="attach" class="icon-btn" title="Attach image">
      <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
    </button>
    <input type="file" id="file" accept="image/*" hidden />

    <button type="button" id="cameraBtn" class="icon-btn" title="Take photo">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
    </button>

    <input id="input" autocomplete="off" placeholder="Type a message" />

    <button id="send" class="icon-btn" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </form>

  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
